<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>TaxPain (icono de macOS: con el margen y la sombra de la plantilla de Apple)</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d01c29"/>
      <stop offset="1" stop-color="#a8101c"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(100 100) scale(1.609375)" filter="url(#sombra)">
    <rect width="512" height="512" rx="115" fill="url(#fondo)"/>
    <rect x="124" y="124" width="264" height="58" rx="29" fill="#fff"/>
    <path d="M296 182 L226 392" stroke="#fff" stroke-width="58" stroke-linecap="round"/>
    <circle cx="168" cy="262" r="30" fill="#fabd00"/>
    <circle cx="352" cy="346" r="30" fill="#fabd00"/>
  </g>
</svg>
