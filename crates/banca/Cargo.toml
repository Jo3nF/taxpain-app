[package]
name = "taxpain-banca"
description = "Lectura de cuentas bancarias en solo lectura (PSD2) a través de Enable Banking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.23.1"
thiserror.workspace = true
tracing = "0.1.44"
url = "2.5.8"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
rustls-platform-verifier = "0.7.1"
taxpain-vault.workspace = true
# La espera de la vuelta del banco en 127.0.0.1 (sólo mientras se conecta una cuenta).
tokio = { version = "1.53.2", features = ["time", "net", "io-util"] }

[features]
# `Cliente::con_raiz` y `ClienteFlex::con_raiz` (otra base https y una CA propia): sólo para
# tests, nunca en la app.
mock = []

[lints]
workspace = true

[dev-dependencies]
# Los tests de integración usan los constructores de `mock`.
taxpain-banca = { path = ".", features = ["mock"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging"] }
taxpain-testkit.workspace = true
# Para comprobar la firma RS256 de los tokens en el servidor simulado.
ring = "0.17.14"
