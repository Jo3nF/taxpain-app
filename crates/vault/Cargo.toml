[package]
name = "taxpain-vault"
description = "Almacén cifrado local: BD SQLCipher, claves, certificados y auditoría"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11.1"
getrandom = "0.4.3"
hex = "0.4.3"
p12-keystore = "0.4.1"
rusqlite = { version = "0.42.0", features = ["bundled-sqlcipher"] }
scrypt = { version = "0.12.0", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
taxpain-core.workspace = true
taxpain-secrets.workspace = true
thiserror.workspace = true
time = { version = "0.3.55", features = ["formatting"] }
tracing = "0.1.44"
x509-parser = "0.18.1"
zeroize = { version = "1.9.1", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
taxpain-testkit.workspace = true
tempfile = "3.27.0"
tracing-subscriber = "0.3.23"
