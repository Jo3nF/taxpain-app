[package]
name = "taxpain-aeat"
description = "Integración con la AEAT: diseños de registro, prevalidación, presentación y VERI*FACTU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
base64 = "0.23.1"
taxpain-core.workspace = true
taxpain-models.workspace = true
taxpain-vault.workspace = true
taxpain-invoicing.workspace = true
thiserror.workspace = true
tracing = "0.1.44"
url = "2.5.8"
quick-xml = "0.42.0"
time = "0.3.55"
rustls-platform-verifier = "0.7.1"
# Ya está en el árbol por reqwest: sólo la pausa entre peticiones a la Sede pública.
tokio = { version = "1.53.2", features = ["time"] }

[features]
# Constructores contra un servidor simulado (`Destination::mock`, `Destino::mock`,
# `Endpoints::mock`) y puertos explícitos en localhost: sólo para tests, nunca en la app.
mock = []

[lints]
workspace = true

[dev-dependencies]
# Los tests de integración usan los constructores de `mock`.
taxpain-aeat = { path = ".", features = ["mock"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "tracing-log"] }
taxpain-testkit.workspace = true
time = { version = "0.3.55", features = ["macros"] }
