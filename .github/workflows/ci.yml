name: CI

# Linux corre en cada push a master y en cada pull request (minutos a 1×; con `paths-ignore`
# para que un cambio sólo de documentación no gaste nada). macOS sólo a mano (Actions → CI →
# Run workflow): cada minuto de macOS cuenta como 10 y el plan gratuito del repositorio privado
# da 2.000 al mes con el límite de gasto a 0 $ (si se agotan, GitHub no arranca los trabajos y
# manda un correo por cada push; los minutos vuelven el día 1). El CI completo se pasa siempre
# en local con ./scripts/ci.sh antes de subir nada.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'media/**'
      - '.github/dependabot.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'media/**'
      - '.github/dependabot.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Acciones fijadas por hash de commit (Dependabot propone las actualizaciones).
jobs:
  macos:
    name: macOS (Apple Silicon) — núcleo, app Tauri y frontend
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Rust (versión de rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci --no-audit --no-fund
      - name: CI completo (fmt, clippy, tests, build de la app, biome, tsc, vitest)
        run: ./scripts/ci.sh

  linux:
    name: Linux — núcleo, app Tauri y frontend
    # Fijado a 24.04: en 26.04 el paquete `libxml2` ya no existe (pasa a `libxml2-16`, con
    # `libxml2.so.16`) y `crates/testkit/src/xsd.rs` enlaza con `libxml2.so.2`.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Dependencias del sistema (SQLCipher con OpenSSL, libxml2 para tests XSD, pdftotext, WebKitGTK para la app Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libxml2 poppler-utils \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Rust (versión de rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo-audit (vulnerabilidades conocidas en las dependencias de Rust; ci.sh lo usa si está)
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
      - run: npm ci --no-audit --no-fund
      - run: ./scripts/ci.sh
      - name: Accesibilidad (axe-core sobre el modo demo, WCAG 2.1 AA, claro y oscuro)
        run: |
          npx playwright-core install --with-deps chromium-headless-shell
          node tools/a11y/check.mjs
          node tools/a11y/check.mjs --no-build --dark
