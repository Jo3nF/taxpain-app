<!doctype html>

<style>

  .plano { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

  .progreso { position: absolute; left: 0; bottom: 0; height: 8px; width: 100%; transform-origin: 0 50%; z-index: 9;

  .msg { position: absolute; right: 44px; padding: 22px 34px; border-radius: 30px 30px 8px 30px; background: var(--marca);
    font-size: 44px; font-weight: 600; white-space: pre; min-height: 98px; min-width: 70px; letter-spacing: -0.01em; }
  .herr { position: absolute; left: 44px; display: inline-flex; gap: 14px; align-items: center; padding: 14px 24px;
    border-radius: 16px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    font: 600 28px ui-monospace, SFMono-Regular, Menlo, monospace; color: #b9c4e4; }
  .herr i { font-style: normal; color: #5fd68a; }
  .col { position: absolute; left: 44px; display: flex; flex-direction: column; gap: 24px; align-items: flex-start; }
  .resp { width: 1180px; padding: 30px 38px; border-radius: 30px 30px 30px 8px; background: #fff;
    color: #0f1629; font-size: 42px; line-height: 1.36; font-weight: 500; letter-spacing: -0.01em; }
  .fuente { padding: 14px 16px 16px; border-radius: 20px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); }
  .fuente small { display: block; font-size: 22px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--marca-2); margin: 0 0 12px 6px; }
  .fuente div { border-radius: 12px; background-repeat: no-repeat; background-color: #fff; }
  .resp b { font-weight: 800; }
  .resp em { font-style: normal; color: #2b50d6; font-weight: 700; }
  .resp small { display: block; margin-top: 16px; font-size: 27px; color: #6b7590; line-height: 1.35; }
  .nodo { position: absolute; width: 560px; padding: 20px 30px; border-radius: 18px; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14); font-size: 38px; font-weight: 700; }
  .nodo small { display: block; font-size: 24px; color: var(--suave); font-weight: 600; margin-top: 4px; }
  .bola { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--marca-2);
    box-shadow: 0 0 22px var(--marca-2); }

    filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
  .pulso { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%;
    border: 3px solid var(--marca); z-index: 2; }
  .onda { position: absolute; border-radius: 50%; border: 3px solid var(--marca-2); }
  .punto-lista { position: absolute; left: 310px; width: 1300px; padding: 30px 40px; border-radius: 24px; font-size: 46px;
    font-weight: 700; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); display: flex; gap: 22px;
    align-items: center; }
  .punto-lista i { font-style: normal; color: #5fd68a; font-weight: 800; }
  .punto-lista.ojo { border-color: rgba(250,189,0,.5); }
  .url { font-size: 36px; font-weight: 700; color: var(--marca-2); letter-spacing: -0.01em; }
  /* Los selectores más específicos, al final (orden de especificidad). */
  .rotulo b i { font-style: normal; color: #5fd68a; font-variant-numeric: tabular-nums; }
  .ventana .barra i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  .hallazgo p b { color: #2b50d6; }
  .puntos i.hecho { background: var(--marca); }
  .puntos i.ahora { background: var(--marca-2); box-shadow: 0 0 16px var(--marca-2); transform: scale(1.3); }
  .punto-lista.ojo i { color: #fbd25a; }
  .hallazgo .tags span { padding: 6px 16px; border-radius: 999px; background: #eef1f6; }
  .hallazgo .tags span:first-child { background: var(--cb, #fde2e4); color: var(--c, #b0141f); }
  .hallazgo .tags span.importe { margin-left: auto; background: #dcf5e6; color: #0b6b3a; }
  .chatw .cab small { margin-left: auto; font-size: 25px; color: var(--suave); font-weight: 600; display: flex;
    align-items: center; gap: 12px; }
  .chatw .cab small i { width: 12px; height: 12px; border-radius: 50%; background: #5fd68a; box-shadow: 0 0 12px #5fd68a; display: block; }
</style>

<body>
<div id="stage"></div>
<script type="module">
const stage = document.getElementById('stage');
const params = new URLSearchParams(location.search);
const cual = params.get('v') ?? 'lanzamiento';

const LOGO = `<svg viewBox="0 0 512 512" width="100%" height="100%"><defs><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d01c29"/><stop offset="1" stop-color="#a8101c"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#f)"/><rect x="124" y="124" width="264" height="58" rx="29" fill="#fff"/><path d="M296 182 L226 392" stroke="#fff" stroke-width="58" stroke-linecap="round"/><circle cx="168" cy="262" r="30" fill="#fabd00"/><circle cx="352" cy="346" r="30" fill="#fabd00"/></svg>`;

const ESC = { out: 'cubic-bezier(.16,1,.3,1)', inn: 'cubic-bezier(.7,0,.84,0)', io: 'cubic-bezier(.65,0,.35,1)' };
const pistas = [];

function nodo(html, estilo = {}, clase = 'abs', padre = stage) {
  const n = document.createElement('div');
  n.className = clase;
  n.innerHTML = html;
  Object.assign(n.style, estilo);
  padre.appendChild(n);
  return n;
}

// Una pista: fotogramas clave con tiempo absoluto en segundos. Se convierten en una única
// animación que dura todo el vídeo, para poder fijar cualquier instante con currentTime.
function pista(n, claves) {
  pistas.push({ n, claves });
}

// Aparece en `a` y se va en `b`, con transformaciones de entrada y salida.
function aparece(n, a, b, o = {}) {
  const desde = o.desde ?? 'translateY(60px)';
  const hasta = o.hasta ?? 'translateY(-40px)';
  const quieto = o.quieto ?? 'none';
  const ent = o.ent ?? 0.55;
  const sal = o.sal ?? 0.35;
  const blur = o.blur ?? 12;
  const k = [
    { t: 0, opacity: 0, transform: desde, filter: `blur(${blur}px)` },
    { t: a, opacity: 0, transform: desde, filter: `blur(${blur}px)`, easing: ESC.out },
    { t: a + ent, opacity: 1, transform: quieto, filter: 'blur(0px)' },
  ];
  if (b != null) {
    k.push({ t: b - sal, opacity: 1, transform: quieto, filter: 'blur(0px)', easing: ESC.inn });
    k.push({ t: b, opacity: 0, transform: hasta, filter: `blur(${blur}px)` });
  }
  pista(n, k);
}

// El logo con el nombre, arriba, en la primera pantalla. Está entero desde el primer fotograma (el
// que se ve antes de reproducir el vídeo) y se va con el titular, en `b`.
function marca(b, y = 130) {
  const n = nodo(`<span class="marca-logo">${LOGO}</span><span>TaxPain</span>`, { top: `${y}px` }, 'centro marca');
  pista(n, [
    { t: 0, opacity: 1, transform: 'scale(.9)', filter: 'blur(0px)', easing: ESC.out },
    { t: 0.7, opacity: 1, transform: 'none', filter: 'blur(0px)' },
    { t: b - 0.35, opacity: 1, transform: 'none', filter: 'blur(0px)', easing: ESC.inn },
    { t: b, opacity: 0, transform: 'translateY(-40px)', filter: 'blur(12px)' },
  ]);
}

function palabras(texto, y, a, b, o = {}) {
  const linea = nodo('', { top: `${y}px` }, `centro ${o.clase ?? 'grande'}`);
  const trozos = texto.split(' ');
  trozos.forEach((p, i) => {
    const s = document.createElement('span');
    s.className = 'palabra' + (o.acento?.includes(i) ? ' acento' : '');
    s.textContent = p + (i < trozos.length - 1 ? ' ' : '');
    linea.appendChild(s);
    aparece(s, a + i * (o.paso ?? 0.12), b, { desde: 'translateY(70px) scale(.96)', hasta: 'translateY(-50px)', blur: 14 });
  });
  return linea;
}

function fondo(total) {
  const g1 = nodo('', { width: '900px', height: '900px', background: '#2b50d6', left: '-200px', top: '-300px' }, 'glow');
  const g2 = nodo('', { width: '800px', height: '800px', background: '#7a1220', right: '-250px', bottom: '-350px', opacity: '.35' }, 'glow');
  pista(g1, [
    { t: 0, transform: 'translate(0,0) scale(1)' },
    { t: total, transform: 'translate(500px,260px) scale(1.25)' },
  ]);
  pista(g2, [
    { t: 0, transform: 'translate(0,0)' },
    { t: total, transform: 'translate(-420px,-200px)' },
  ]);
}

// Escena con captura: texto a la izquierda y ventana de la app a la derecha, saliendo por el borde.
function ventana(img, estilo, clase = 'ventana') {
  return nodo(`<div class="barra"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><div class="lienzo"><img src="/media/screens/${img}.png"></div>`,
    estilo, clase);
}

function captura(img, kicker, titulo, sub, a, b, o = {}) {
  const extra = o.aviso ? `<div class="aviso">${o.aviso}</div>` : '';
  const texto = nodo(`<div class="kicker">${kicker}</div><div class="titulo">${titulo}</div><div class="sub">${sub}</div>${extra}`,
    { left: '120px', top: o.top ?? '330px', width: '600px' });
  aparece(texto, a + 0.1, b, { desde: 'translateX(-60px)', hasta: 'translateX(-40px)' });
  const ancho = o.ancho ?? 1340;
  const v = ventana(img, { left: '790px', top: o.vtop ?? '120px', width: `${ancho}px` });
  aparece(v, a, b, {
    desde: 'perspective(2400px) translate(160px, 90px) rotateY(-14deg) rotateX(6deg) scale(.9)',
    quieto: 'perspective(2400px) rotateY(-6deg) rotateX(2deg)',
    hasta: 'perspective(2400px) translate(-80px, -40px) rotateY(-4deg) scale(.96)',
    ent: 0.75, sal: 0.35, blur: 6,
  });
  const im = v.querySelector('img');
  if (o.origen) im.style.transformOrigin = o.origen;
  pista(im, [
    { t: 0, transform: 'scale(1)' },
    { t: a + 0.4, transform: 'scale(1)', easing: ESC.io },
    { t: b, transform: `scale(${o.zoom ?? 1.12})` },
  ]);
  // Segunda ventana, más pequeña, que entra por delante (p. ej. cripto + valores).
  if (o.segunda) {
    const v2 = ventana(o.segunda, { left: '700px', top: '560px', width: '760px', zIndex: 2 });
    aparece(v2, a + 0.7, b, { desde: 'translate(-80px, 120px) scale(.85)', hasta: 'translateY(-30px)', ent: 0.6, blur: 6 });
  }
  // Bocadillos de chat por encima de la ventana.
  (o.chat ?? []).forEach(([txt, mio], k) => {
    const n = nodo(txt, mio
      ? { right: '120px', top: `${o.chatTop + k * 120}px`, background: 'var(--marca)', color: '#fff', zIndex: 3 }
      : { right: '380px', top: `${o.chatTop + k * 120}px`, background: '#fff', color: '#0f1629', zIndex: 3 }, 'bocadillo');
    aparece(n, a + 0.8 + k * 0.6, b, { desde: 'translateY(40px) scale(.9)', hasta: 'translateY(-20px)', ent: 0.45, blur: 6 });
  });
}

// Fila (o filas) de modelos que llegan de la AEAT, cada uno con su «descargado».
function modelos(lista, y, a, b, cols = lista.length) {
  const ancho = 170, hueco = 26;
  const x0 = (1920 - (cols * ancho + (cols - 1) * hueco)) / 2;
  lista.forEach((m, i) => {
    const col = i % cols, fila = Math.floor(i / cols);
    const n = nodo(`${m}<small>✓ DESCARGADO</small>`, { left: `${x0 + col * (ancho + hueco)}px`, top: `${y + fila * 150}px` }, 'modelo');
    aparece(n, a + i * 0.06, b, { desde: 'translateY(-90px) scale(.8)', hasta: 'scale(.9)', ent: 0.4, blur: 8 });
  });
}

// Tu carpeta frente a lo presentado, y en medio lo que no cuadra.
function cruce(a, b, cuantas = 3) {
  const izq = [['Tu carpeta', 'Facturas'], ['', 'Escrituras'], ['', 'Extractos del banco'], ['', 'Libros y diario']];
  const der = [['Presentado', '303 · IVA'], ['', '111 · Retenciones'], ['', '200 · Sociedades'], ['', '347 · Terceros']];
  izq.forEach(([k, t], i) => {
    const n = nodo(`${k ? `<small>${k}</small>` : ''}${t}`, { left: '120px', top: `${250 + i * 150 - (k ? 38 : 0)}px` }, 'pieza');
    aparece(n, a + i * 0.1, b, { desde: 'translateX(-120px)', hasta: 'translateX(200px) scale(.9)', ent: 0.45 });
  });
  der.forEach(([k, t], i) => {
    const n = nodo(`${k ? `<small>${k}</small>` : ''}${t}`, { right: '120px', top: `${250 + i * 150 - (k ? 38 : 0)}px` }, 'pieza');
    aparece(n, a + 0.15 + i * 0.1, b, { desde: 'translateX(120px)', hasta: 'translateX(-200px) scale(.9)', ent: 0.45 });
  });
  const c = nodo(`<b>${cuantas}</b><span>no cuadran</span>`, { left: '810px', top: '380px' }, 'choque');
  aparece(c, a + 0.9, b, { desde: 'scale(.3)', quieto: 'none', hasta: 'scale(1.3)', ent: 0.5, blur: 10 });
}

// Tarjetas de hallazgos (datos de ejemplo). Cada una: color, fondo de la etiqueta, gravedad,
// responsable, título, qué hacer y, si lo lleva, el importe recuperable.
const HALLAZGOS = [
  ['#d01c29', '#fde2e4', 'Error', 'Gestoría', 'El 390 no cuadra con los 303', 'Qué hacer: <b>pide la declaración corregida</b>. Rectificable hasta el 30/01/2030.'],
  ['#c27a00', '#fff1cc', 'Aviso', 'Empresa', 'Una factura está dos veces en el libro', 'Qué hacer: <b>deja una sola copia</b> antes del próximo 303.'],
  ['#2b50d6', '#e3e9ff', 'Para saber', 'Documentación', 'Falta la escritura del último cambio de administrador', 'Qué hacer: <b>pídela al Registro</b>.'],
];
function hallazgos(a, b, lista = HALLAZGOS) {
  lista.forEach(([c, cb, g, r, h, p, imp], i) => {
    const n = nodo(`<div class="tags"><span>${g}</span><span>${r}</span>${imp ? `<span class="importe">${imp}</span>` : ''}</div><h3>${h}</h3><p>${p}</p>`,
      { top: `${250 + i * 255}px` }, 'hallazgo');
    n.style.setProperty('--c', c);
    n.style.setProperty('--cb', cb);
    aparece(n, a + 0.15 + i * 0.35, b, { desde: 'translateY(80px) scale(.94)', hasta: 'translateY(-30px)', ent: 0.5, blur: 8 });
  });
}

function cierre(a, b, url, estado = 'En desarrollo (alfa)') {
  const logo = nodo(LOGO, { width: '150px', height: '150px', left: '885px', top: '250px' });
  aparece(logo, a, b, { desde: 'scale(.6) rotate(-8deg)', quieto: 'none', ent: 0.7, blur: 10 });
  palabras('TaxPain', 430, a + 0.2, b, { clase: 'grande' });
  const lema = nodo('Tu gestoría en tu Mac.', { top: '590px', fontSize: '42px', color: 'var(--suave)', fontWeight: '500' }, 'centro');
  aparece(lema, a + 0.55, b);

// ---- Ayudas de los vídeos de funciones, pasos, Claude y cripto ----

// Lo que no se puede declarar como animación (contar, teclear) se fija a mano en cada fotograma.
const vivos = [];
const eur = (v) => {
  const [e, d] = v.toFixed(2).split('.');
  return `${e.replace(/\B(?=(\d{3})+(?!\d))/g, '.')},${d} €`;
};
function contador(n, t0, dur, hasta, fmt = eur) {
  vivos.push((s) => {
    const p = Math.min(1, Math.max(0, (s - t0) / dur));
    n.textContent = fmt(hasta * (1 - (1 - p) ** 3));
  });
}
function teclea(n, texto, t0, cps = 34) {
  vivos.push((s) => {
    const k = Math.max(0, Math.min(texto.length, Math.floor((s - t0) * cps)));
    n.textContent = texto.slice(0, k) || '​';
  });
  return t0 + texto.length / cps;
}

function progreso(total) {
  const n = nodo('', {}, 'progreso');
  pista(n, [{ t: 0, transform: 'scaleX(0)' }, { t: total, transform: 'scaleX(1)' }]);
}

function indice(i, n, a, b) {
  const el = nodo(`<b>${String(i).padStart(2, '0')}</b> / ${String(n).padStart(2, '0')}`, {}, 'indice');
  aparece(el, a + 0.1, b, { desde: 'translateY(-20px)', hasta: 'none', ent: 0.35, sal: 0.2, blur: 4 });
}

function puntos(i, n, a, b) {
  const html = Array.from({ length: n }, (_, k) => `<i class="${k + 1 < i ? 'hecho' : k + 1 === i ? 'ahora' : ''}"></i>`).join('');
  const el = nodo(html, {}, 'puntos');
  aparece(el, a + 0.1, b, { desde: 'translateY(-20px)', hasta: 'none', ent: 0.35, sal: 0.2, blur: 4 });
}

// Ventana grande con cámara: va de parada en parada dentro de la misma captura, con un rótulo y,
// si se pide, un recuadro que atenúa lo demás. `x`, `y` y `caja` son fracciones de la imagen.
// El rótulo va abajo a la izquierda; con `arriba` sube y con `der` pasa a la derecha.
function recorrido(img, kicker, titulo, paradas, a, b, o = {}) {
  const W = o.ancho ?? 1560, H = o.alto ?? 780, Hi = W * (o.ratio ?? 0.625);
  const left = (1920 - W) / 2, top = o.top ?? 210;
  const cab = nodo(`<div class="kicker">${kicker}</div><div class="titulo2">${titulo}</div>`,
    { left: `${left}px`, top: '58px', width: `${W - 260}px` });
  aparece(cab, a + 0.05, b, { desde: 'translateY(-36px)', hasta: 'translateY(-24px)', ent: 0.45, blur: 6 });
  const v = nodo(`<div class="barra"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><div class="lienzo" style="height:${H}px;position:relative"><div class="plano" style="width:${W}px;height:${Hi}px"><img src="/media/screens/${img}.png"></div></div>`,
    { left: `${left}px`, top: `${top}px`, width: `${W}px` }, 'ventana');
  aparece(v, a, b, { desde: 'translateY(110px) scale(.93)', hasta: 'translateY(-50px) scale(.97)', ent: 0.65, blur: 8 });
  const plano = v.querySelector('.plano');
  const pos = (x, y, z) => {
    const tx = Math.min(0, Math.max(W - W * z, W / 2 - x * W * z));
    const ty = Math.min(0, Math.max(Math.min(0, H - Hi * z), H / 2 - y * Hi * z));
    return `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) scale(${z})`;
  };
  const dur = b - a, n = paradas.length, mueve = o.mueve ?? 0.8;
  const ini = (i) => a + (paradas[i].t ?? i / n) * dur;
  const claves = [];
  paradas.forEach((p, i) => {
    const t0 = i === 0 ? a : ini(i) + mueve;
    const t1 = i === n - 1 ? b : ini(i + 1);
    const z = p.z ?? 1;
    if (i === 0) claves.push({ t: 0, transform: pos(p.x, p.y, z) });
    claves.push({ t: t0, transform: pos(p.x, p.y, z), easing: 'linear' });
    claves.push({ t: t1, transform: pos(p.x, p.y, z * 1.03), easing: ESC.io });
    if (p.caja) {
      const [cx, cy, cw, ch] = p.caja;
      const r = nodo('', { left: `${cx * 100}%`, top: `${cy * 100}%`, width: `${cw * 100}%`, height: `${ch * 100}%` }, 'resalte', plano);
      aparece(r, t0 + (i === 0 ? 0.7 : 0.1), t1, { desde: 'scale(1.04)', hasta: 'none', ent: 0.4, sal: 0.25, blur: 0 });
    }
    if (p.clic) {
      const [kx, ky] = p.clic, llega = t0 + 1.25;
      const estilo = { left: `${kx * 100}%`, top: `${ky * 100}%` };
      const cur = nodo(`<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M4 2l15 9.5-6.6 1.3L16.3 20l-3 1.4-3.8-7.2L4 19z" fill="#fff" stroke="#0f1629" stroke-width="1.5" stroke-linejoin="round"/></svg>`, estilo, 'cursor', plano);
      pista(cur, [
        { t: 0, opacity: 0, transform: 'translate(220px, 150px)' },
        { t: t0 + 0.5, opacity: 0, transform: 'translate(220px, 150px)', easing: ESC.out },
        { t: llega, opacity: 1, transform: 'translate(0, 0)' },
        { t: llega + 0.12, opacity: 1, transform: 'translate(0, 0) scale(.82)' },
        { t: llega + 0.26, opacity: 1, transform: 'translate(0, 0)' },
        { t: t1 - 0.2, opacity: 1, transform: 'translate(0, 0)' },
        { t: t1, opacity: 0, transform: 'translate(0, 0)' },
      ]);
      const pul = nodo('', estilo, 'pulso', plano);
      pista(pul, [
        { t: 0, opacity: 0, transform: 'scale(.3)' },
        { t: llega + 0.1, opacity: 0, transform: 'scale(.3)' },
        { t: llega + 0.12, opacity: 0.9, transform: 'scale(.3)', easing: ESC.out },
        { t: llega + 0.7, opacity: 0, transform: 'scale(1.5)' },
      ]);
    }
    if (p.rot) {
      const alto = p.sub ? 168 : 112;
      const r = nodo(`<b>${p.rot}</b>${p.sub ? `<span>${p.sub}</span>` : ''}`,
        { [p.der ? 'right' : 'left']: `${left + 36}px`, top: `${p.arriba ? top + 76 : top + 40 + H - alto - 30}px`, zIndex: 3 }, 'rotulo');
      const entra = t0 + (i === 0 ? 0.55 : 0.05);
      aparece(r, entra, i === n - 1 ? b : t1 + 0.1, { desde: 'translateY(40px)', hasta: 'translateY(-20px)', ent: 0.45, sal: 0.3, blur: 6 });
      const num = r.querySelector('i');
      if (num && p.cuenta) contador(num, entra + 0.2, 1.3, p.cuenta);
    }
  });
  pista(plano, claves);
}

// Conversación con Claude por MCP: la pregunta se teclea, se ve la herramienta que usa y la respuesta.
// Los tiempos `t` de cada turno son absolutos.
function chat(a, b, turnos, o = {}) {
  const W = 1500, H = 850, left = (1920 - W) / 2, top = o.top ?? 190;
  const w = nodo(`<div class="cab"><span>Claude</span><small><i></i>taxpain · conectado por MCP</small></div>`,
    { left: `${left}px`, top: `${top}px`, width: `${W}px`, height: `${H}px` }, 'chatw');
  aparece(w, a, b, { desde: 'translateY(100px) scale(.94)', hasta: 'translateY(-40px) scale(.97)', ent: 0.6, blur: 8 });
  turnos.forEach((t, i) => {
    const t1 = (turnos[i + 1]?.t ?? b) - 0.05;
    const q = nodo('', { top: '114px' }, 'msg', w);
    aparece(q, t.t, t1, { desde: 'translateY(30px) scale(.95)', hasta: 'translateY(-30px)', ent: 0.3, sal: 0.3, blur: 4 });
    const fin = teclea(q, t.q, t.t + 0.25);
    const h = nodo(`<i>✓</i> taxpain › ${t.tool}`, { top: '244px' }, 'herr', w);
    aparece(h, fin + 0.25, t1, { desde: 'translateX(-30px)', hasta: 'translateY(-30px)', ent: 0.35, sal: 0.3, blur: 4 });
    const col = nodo('', { top: '334px' }, 'col', w);
    const r = nodo(t.r, {}, 'resp', col);
    aparece(r, fin + 0.75, t1, { desde: 'translateY(40px) scale(.97)', hasta: 'translateY(-30px)', ent: 0.45, sal: 0.3, blur: 6 });
    // El mismo dato, recortado de la captura de la app.
    if (t.fuente) {
      const [img, [x, y, cw, ch], ancho, ratio = 0.625] = t.fuente;
      const bw = ancho / cw;
      const f = nodo(`<small>En TaxPain</small><div style="width:${ancho}px;height:${(ch * ratio * bw).toFixed(0)}px;background-image:url(/media/screens/${img}.png);background-size:${bw.toFixed(0)}px auto;background-position:${(-x * bw).toFixed(0)}px ${(-y * ratio * bw).toFixed(0)}px"></div>`,
        {}, 'fuente', col);
      aparece(f, fin + 1.5, t1, { desde: 'translateY(40px) scale(.95)', hasta: 'translateY(-30px)', ent: 0.5, sal: 0.3, blur: 6 });
    }
  });
}

// De dónde vienen los datos (izquierda) y qué sale (derecha), pasando por TaxPain.
function flujo(a, b, izq, der) {
  const cy = 590;
  izq.forEach(([t, sub], i) => {
    const y = 310 + i * 150;
    const n = nodo(`${t}<small>${sub}</small>`, { left: '110px', top: `${y}px` }, 'nodo');
    aparece(n, a + i * 0.12, b, { desde: 'translateX(-100px)', hasta: 'translateX(-60px)', ent: 0.45 });
    const bola = nodo('', { left: '690px', top: `${y + 48}px` }, 'bola');
    const sale = a + 0.9 + i * 0.16, fin = `translate(200px, ${cy - (y + 55)}px)`;
    pista(bola, [
      { t: 0, opacity: 0, transform: 'translate(0,0)' },
      { t: sale, opacity: 0, transform: 'translate(0,0)', easing: ESC.io },
      { t: sale + 0.12, opacity: 1, transform: 'translate(30px,0)', easing: ESC.io },
      { t: sale + 0.7, opacity: 1, transform: fin },
      { t: sale + 0.82, opacity: 0, transform: fin },
    ]);
  });
  const logo = nodo(LOGO, { width: '190px', height: '190px', left: '865px', top: `${cy - 95}px` });
  aparece(logo, a + 0.45, b, { desde: 'scale(.5) rotate(-10deg)', hasta: 'scale(.9)', ent: 0.6, blur: 10 });
  [0, 0.45].forEach((d) => {
    const onda = nodo('', { width: '190px', height: '190px', left: '865px', top: `${cy - 95}px` }, 'onda');
    pista(onda, [
      { t: 0, opacity: 0, transform: 'scale(1)' },
      { t: a + 1.69 + d, opacity: 0, transform: 'scale(1)' },
      { t: a + 1.7 + d, opacity: 0.8, transform: 'scale(1)', easing: ESC.out },
      { t: a + 2.6 + d, opacity: 0, transform: 'scale(2.1)' },
    ]);
  });
  der.forEach(([t, sub], i) => {
    const y = 310 + i * 150;
    const sale = a + 2.0 + i * 0.16, fin = `translate(170px, ${y + 55 - cy}px)`;
    const bola = nodo('', { left: '1060px', top: `${cy - 7}px` }, 'bola');
    pista(bola, [
      { t: 0, opacity: 0, transform: 'translate(0,0)' },
      { t: sale, opacity: 0, transform: 'translate(0,0)', easing: ESC.io },
      { t: sale + 0.12, opacity: 1, transform: 'translate(20px,0)', easing: ESC.io },
      { t: sale + 0.6, opacity: 1, transform: fin },
      { t: sale + 0.72, opacity: 0, transform: fin },
    ]);
    const n = nodo(`${t}<small>${sub}</small>`, { left: '1250px', top: `${y}px` }, 'nodo');
    aparece(n, sale + 0.5, b, { desde: 'translateX(-40px) scale(.94)', hasta: 'translateX(60px)', ent: 0.45 });
  });
}

const total = VIDEOS[cual]();
for (const { n, claves } of pistas) {
  const fr = claves.map(({ t, ...resto }) => ({ ...resto, offset: Math.min(1, Math.max(0, t / total)) }));
  if (fr[0].offset !== 0) fr.unshift({ ...fr[0], offset: 0, easing: 'linear' });
  if (fr.at(-1).offset !== 1) fr.push({ ...fr.at(-1), offset: 1, easing: 'linear' });
  const a = n.animate(fr, { duration: total * 1000, fill: 'both' });
  a.pause();
}
